name: Build AppleWin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the Release

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release (32-bit)
        run: msbuild AppleWin-VS2022.sln /m /p:Configuration=Release /p:Platform=Win32

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem -Recurse -Filter "AppleWin*.exe" | Where-Object { $_.FullName -notmatch '\\out\\' } | Copy-Item -Destination out
          Copy-Item bin\keymap.txt out

      - uses: actions/upload-artifact@v4
        with:
          name: AppleWin-keyremap
          path: out

      # Permanent download: replace the "latest" Release with this build
      - name: Publish Release
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path out\* -DestinationPath AppleWin-keyremap.zip -Force
          gh release delete latest --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest AppleWin-keyremap.zip --target $env:GITHUB_SHA --title "AppleWin with key remapping (latest build)" --notes "Unzip, keep keymap.txt next to AppleWin.exe. Configuration > Input > Key Remapping. Built from commit $env:GITHUB_SHA."
